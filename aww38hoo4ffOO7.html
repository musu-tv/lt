  const videoEl         = document.getElementById("video-player");
  const embedEl         = document.getElementById("embed-player");
  const playlistEl      = document.getElementById("playlist");
  const playerContainer = document.getElementById("player-container");
  const fullscreenBtn   = document.getElementById("fullscreenBtn");
  const preloaderEl     = document.getElementById("preloader");
  const errBox          = document.getElementById("err-box");

  let currentIndex = -1;

  function loadVideo(index) {
    const item = videos[index];
    if (item.type === "separator") return; // separatoriaus neskleidžiam

    currentIndex = index;
    errBox.style.display = "none";
    preloaderEl.style.display = "none";   // slepiam pradinį paveikslėlį

    if (item.type === "mp4") {
      // sustabdom embed ir slepiam iframe
      embedEl.src = "about:blank";
      embedEl.style.display = "none";
      // rodom video
      videoEl.style.display = "block";
      videoEl.src = item.src;
      videoEl.load();
      videoEl.play().catch(function () {}); // jei uždrausta — liks su mygtuku
    } else if (item.type === "embed") {
      // sustabdom mp4 ir slepiam video
      videoEl.pause();
      videoEl.removeAttribute("src");
      videoEl.load();
      videoEl.style.display = "none";
      // rodom iframe
      embedEl.style.display = "block";
      embedEl.src = item.src;
    }

    // pažymim aktyvią seriją playliste
    const items = playlistEl.querySelectorAll("div");
    items.forEach(function (d, i) {
      d.classList.toggle("active", videos[i].type !== "separator" && i === index);
    });
  }

  // sugeneruojam playlistą
  videos.forEach((v, i) => {
    const div = document.createElement("div");
    div.textContent = v.title;
    div.onclick = () => loadVideo(i);
    playlistEl.appendChild(div);
  });

  // automatiškai sekanti serija pasibaigus (veikia tik mp4 —
  // iframe pabaigos signalo iš kito domeno gauti neįmanoma)
  videoEl.addEventListener("ended", () => {
    for (let i = currentIndex + 1; i < videos.length; i++) {
      if (videos[i].type !== "separator") { loadVideo(i); break; }
    }
  });

  videoEl.addEventListener("error", () => {
    const k = videoEl.error ? videoEl.error.code : "?";
    errBox.style.display = "block";
    errBox.textContent = "Klaida įkeliant " + (currentIndex + 1) + " seriją (kodas " + k + ")";
  });

  // playlisto rodymo/slepimo logika
  let hideTimeout;
  function showPlaylist() {
    playlistEl.style.opacity = "1";
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => {
      playlistEl.style.opacity = "0";
    }, 6000);
  }
  playerContainer.addEventListener("mousemove", showPlaylist);
  showPlaylist();

  // fullscreen
  fullscreenBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) playerContainer.requestFullscreen();
    else document.exitFullscreen();
  });
