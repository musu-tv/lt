<style>
  body {
    background: #FFE4B5;
    margin: 0;
    padding: 0;
  }
  #player-container {
    width: 635px;
    height: 450px;
    position: relative;
    background: #000;
    overflow: hidden;
  }
  #video-player {
    width: 100%;
    height: 100%;
    border: none;
    display: none;
    background: #000;
  }
  /* logotipas per vidurį viršuje */
  #logo {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0.7;
    z-index: 5;
    height: 30px;
    width: auto;
  }
  /* vertikalus playlistas kairėje */
  #playlist {
    position: absolute;
    top: 0;
    left: 0;
    height: 85%;
    width: 150px;
    background: rgba(0,0,0,0.5);
    padding: 5px;
    opacity: 0;
    transition: opacity 0.5s;
    overflow-y: auto;
    z-index: 4;
  }
  #playlist div {
    cursor: pointer;
    padding: 6px;
    margin-bottom: 4px;
    border-radius: 4px;
    background: rgba(255,255,255,0.1);
    font-size: 13px;
    color: #fff;
    height: 40px;
    line-height: 1.2em;
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  #playlist div:hover {
    background: rgba(255,255,255,0.2);
  }
  #playlist div.active {
    background: rgba(41,128,185,0.75);
  }
  /* fullscreen mygtukas apačioje dešinėje */
  #fullscreenBtn {
    position: absolute;
    bottom: 5px;
    right: 5px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 18px;
    z-index: 6;
  }
  #fullscreenBtn:hover { background: rgba(80,80,80,0.8); }
  /* pradinio paveikslėlio stilius */
  #preloader {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
    pointer-events: none;
  }
  /* klaidos pranešimas */
  #err-box {
    position: absolute;
    bottom: 8px;
    left: 8px;
    color: #ff6b6b;
    font-size: 13px;
    z-index: 6;
    display: none;
    background: rgba(0,0,0,0.7);
    padding: 4px 8px;
    border-radius: 4px;
  }
</style>

 { title: "96 serija", type: "mp4", src: "https://s3.storage.animesub.lt/anime/N/Naruto/anime_serials_naruto_E96_ltmeg.mp4" },
 { title: "97 serija", type: "mp4", src: "https://s3.storage.animesub.lt/anime/N/Naruto/anime_serials_naruto_E97_ltmeg.mp4" },
 { title: "98 serija", type: "mp4", src: "https://s3.storage.animesub.lt/anime/N/Naruto/anime_serials_naruto_E98_ltmeg.mp4" },

 { title: "101 serija", type: "mp4", src: "https://s3.storage.animesub.lt/anime/N/Naruto/anime_serials_naruto_E101_ltmeg.mp4" }
  ];

  const videoEl         = document.getElementById("video-player");
  const playlistEl      = document.getElementById("playlist");
  const playerContainer = document.getElementById("player-container");
  const fullscreenBtn   = document.getElementById("fullscreenBtn");
  const preloaderEl     = document.getElementById("preloader");
  const errBox          = document.getElementById("err-box");

  let currentIndex = -1;

  function loadVideo(index) {
    const item = videos[index];
    if (item.type !== "mp4") return; // separatoriaus neskleidžiam

    currentIndex = index;
    errBox.style.display = "none";
    preloaderEl.style.display = "none";   // slepiam pradinį paveikslėlį
    videoEl.style.display = "block";
    videoEl.src = item.src;
    videoEl.load();
    videoEl.play().catch(function () {}); // jei uždrausta — žaidėjas liks su mygtuku

    // pažymim aktyvią seriją playliste
    const items = playlistEl.querySelectorAll("div");
    items.forEach(function (d, i) {
      d.classList.toggle("active", videos[i].type === "mp4" && i === index);
    });
  }

  // sugeneruojam playlistą
  videos.forEach((v, i) => {
    const div = document.createElement("div");
    div.textContent = v.title;
    div.onclick = () => loadVideo(i);
    playlistEl.appendChild(div);
  });

  // automatiškai sekanti serija pasibaigus
  videoEl.addEventListener("ended", () => {
    for (let i = currentIndex + 1; i < videos.length; i++) {
      if (videos[i].type === "mp4") { loadVideo(i); break; }
    }
  });

  videoEl.addEventListener("error", () => {
    const k = videoEl.error ? videoEl.error.code : "?";
    errBox.style.display = "block";
    errBox.textContent = "Klaida įkeliant " + (currentIndex + 1) + " seriją (kodas " + k + ")";
  });

  // playlisto rodymo/slepimo logika
  let hideTimeout;
  function showPlaylist() {
    playlistEl.style.opacity = "1";
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => {
      playlistEl.style.opacity = "0";
    }, 6000);
  }
  playerContainer.addEventListener("mousemove", showPlaylist);
  showPlaylist();

  // fullscreen
  fullscreenBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) playerContainer.requestFullscreen();
    else document.exitFullscreen();
  });
</script>
